name: Examples

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # Fails when an examples/NN-* directory is missing from the matrix below,
  # so a new example can't silently go unrun.
  matrix-complete:
    name: Every example is run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the matrix lists every example
        run: |
          missing=0
          for dir in examples/[0-9][0-9]-*/; do
            name=$(basename "$dir")
            if ! grep -qE "^ +- ${name}\$" .github/workflows/examples.yml; then
              echo "::error file=.github/workflows/examples.yml::examples/${name} is not in the matrix"
              missing=1
            fi
          done
          exit "$missing"

  # Each example checks its own results and exits non-zero on a wrong one;
  # examples/run.sh knows how to run the special ones (the CLI server, the
  # benchmark on a small dataset).
  example:
    strategy:
      matrix:
        example:
          - 01-hello-natsql
          - 02-composite-keys
          - 03-malformed-events
          - 04-multiple-views
          - 05-library-embed
          - 06-cli-server
          - 07-perf-benchmark
          - 08-where-operators
          - 09-key-separator
          - 10-source-subject
          - 11-consumer-tuning
          - 12-http-options
          - 13-bool-timestamp
          - 14-yaml-vs-json
          - 15-autocreate-streams
          - 16-poll-for-ready
          - 17-dual-engine
          - 18-nats-request
          - 19-custom-logger
      fail-fast: false
    name: Run ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run
        run: examples/run.sh ${{ matrix.example }}
